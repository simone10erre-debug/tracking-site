<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univertrak | Global Logistics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #1a1a1a; }
        .btn-green { background-color: #5d8574; color: white; transition: all 0.2s; }
        .btn-green:hover { background-color: #4a6a5d; transform: translateY(-1px); }
        .card { border: 1px solid #f0f0f0; transition: all 0.3s ease; }
        .card:hover { border-color: #5d8574; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .hidden { display: none; }
        .timeline-line { position: relative; padding-left: 24px; border-left: 2px solid #f0f0f0; margin-left: 10px; }
        .timeline-dot { position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; background: #5d8574; border-radius: 50%; border: 2px solid white; }
    </style>
</head>
<body class="antialiased">

    <div id="view-home" class="max-w-2xl mx-auto px-6 py-12">
        <nav class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 border-2 border-[#5d8574] rounded-xl flex items-center justify-center font-bold text-[#5d8574]">U</div>
                <div>
                    <h1 class="text-lg font-extrabold tracking-tighter">UNIVERTRAK</h1>
                    <p class="text-[9px] font-bold text-[#5d8574] uppercase tracking-widest">Tracking System</p>
                </div>
            </div>
            <button onclick="openAddModal()" class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:text-[#5d8574]"><i class="fas fa-plus"></i></button>
        </nav>

        <div id="home-list" class="space-y-4">
            </div>
    </div>

    <div id="view-detail" class="max-w-2xl mx-auto px-6 py-12 hidden">
        <button onclick="showHome()" class="mb-8 text-gray-400 text-[10px] font-bold uppercase tracking-widest flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> Torna alla Home
        </button>

        <div class="bg-gray-50 rounded-[2.5rem] p-8 md:p-12 mb-8">
            <div class="flex justify-between items-start mb-10">
                <div>
                    <h2 id="det-title" class="text-3xl font-black tracking-tighter mb-2">---</h2>
                    <p id="det-code" class="text-xs font-mono text-gray-400 font-bold uppercase tracking-widest">---</p>
                </div>
                <div class="flex gap-3">
                    <button id="btn-edit" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-gray-400 shadow-sm"><i class="fas fa-pen text-xs"></i></button>
                    <button id="btn-delete" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-red-300 shadow-sm"><i class="fas fa-trash text-xs"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-6 mb-12">
                <div>
                    <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Mittente</p>
                    <p id="det-sender" class="text-sm font-bold text-gray-800">In attesa...</p>
                </div>
                <div>
                    <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Destinazione</p>
                    <p id="det-country" class="text-sm font-bold text-gray-800">---</p>
                </div>
            </div>

            <div id="det-steps" class="space-y-6">
                </div>
        </div>
    </div>

    <div id="modalAdd" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-white/80 backdrop-blur-md">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-10 shadow-2xl border border-gray-100">
            <h3 class="text-lg font-black mb-8 text-center uppercase tracking-tighter">Nuova Spedizione</h3>
            <div class="space-y-4">
                <input type="text" id="in-desc" placeholder="Descrizione" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-sm font-medium">
                <input type="text" id="in-code" placeholder="Codice Tracking" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-sm font-mono uppercase">
                <button onclick="save()" class="w-full py-4 btn-green rounded-2xl font-bold uppercase text-xs tracking-widest shadow-lg mt-4">Aggiungi</button>
                <button onclick="closeAddModal()" class="w-full text-gray-400 font-bold text-[10px] uppercase py-2">Annulla</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "apik_HvzKptWrIfWVtEuC70AvY6iyGRtTFl";
        let db = JSON.parse(localStorage.getItem('univertrak_v6')) || [];

        function showHome() {
            document.getElementById('view-home').classList.remove('hidden');
            document.getElementById('view-detail').classList.add('hidden');
            render();
        }

        function save() {
            const desc = document.getElementById('in-desc').value;
            const code = document.getElementById('in-code').value.toUpperCase();
            if(!desc || !code) return;
            db.unshift({ id: Date.now(), desc, code });
            localStorage.setItem('univertrak_v6', JSON.stringify(db));
            closeAddModal(); render();
        }

        async function showDetail(id) {
            const item = db.find(x => x.id == id);
            document.getElementById('det-title').innerText = item.desc;
            document.getElementById('det-code').innerText = item.code;
            document.getElementById('det-steps').innerHTML = '<p class="text-center py-10 text-gray-300 animate-pulse">Caricamento passaggi...</p>';
            
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-detail').classList.remove('hidden');

            document.getElementById('btn-delete').onclick = () => { if(confirm("Eliminare?")) { db = db.filter(x => x.id != id); localStorage.setItem('univertrak_v6', JSON.stringify(db)); showHome(); } };
            
            try {
                const res = await fetch(`https://api.trackingmore.com/v4/trackings/get?tracking_numbers=${item.code}`, {
                    headers: { 'Tracking-Api-Key': API_KEY }
                });
                const data = await res.json();
                const track = data.data[0];

                document.getElementById('det-sender').innerText = track.original_carrier || 'Corriere Internazionale';
                document.getElementById('det-country').innerText = track.destination_country || 'Italia';

                let html = '';
                track.origin_info.trackinfo.forEach(step => {
                    html += `
                        <div class="timeline-line">
                            <div class="timeline-dot"></div>
                            <p class="text-sm font-bold text-gray-800">${step.StatusDescription}</p>
                            <p class="text-[10px] text-gray-400 mt-1 uppercase">${step.Date}</p>
                        </div>`;
                });
                document.getElementById('det-steps').innerHTML = html || '<p class="text-gray-400 text-center">Nessun passaggio trovato.</p>';
            } catch (e) {
                document.getElementById('det-steps').innerHTML = '<p class="text-red-400 text-center font-bold text-xs uppercase">Errore di connessione API</p>';
            }
        }

        async function render() {
            const list = document.getElementById('home-list');
            list.innerHTML = db.length ? '' : '<p class="text-center py-20 text-gray-300 uppercase text-[10px] font-bold tracking-widest">Nessuna spedizione</p>';
            
            for (let x of db) {
                const card = document.createElement('div');
                card.className = "card bg-white p-6 rounded-3xl cursor-pointer";
                card.onclick = () => showDetail(x.id);
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h4 class="font-bold text-sm text-gray-900">${x.desc}</h4>
                            <p class="text-[10px] font-mono text-gray-300 uppercase">${x.code}</p>
                        </div>
                        <i class="fas fa-chevron-right text-gray-100"></i>
                    </div>
                    <div id="last-step-${x.id}" class="text-[10px] font-bold text-[#5d8574] uppercase tracking-tight flex items-center gap-2">
                        <span class="w-1.5 h-1.5 bg-[#5d8574] rounded-full animate-pulse"></span> Recupero stato...
                    </div>
                `;
                list.appendChild(card);
                fetchLastStep(x.code, `last-step-${x.id}`);
            }
        }

        async function fetchLastStep(code, elId) {
            try {
                const res = await fetch(`https://api.trackingmore.com/v4/trackings/get?tracking_numbers=${code}`, {
                    headers: { 'Tracking-Api-Key': API_KEY }
                });
                const data = await res.json();
                const last = data.data[0].origin_info.trackinfo[0].StatusDescription;
                document.getElementById(elId).innerHTML = `<span class="w-1.5 h-1.5 bg-[#5d8574] rounded-full"></span> ${last.substring(0, 40)}...`;
            } catch (e) {
                document.getElementById(elId).innerHTML = `<span class="w-1.5 h-1.5 bg-gray-200 rounded-full"></span> Tracking non disponibile`;
            }
        }

        function openAddModal() { document.getElementById('modalAdd').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('modalAdd').classList.add('hidden'); }
        
        render();
    </script>
</body>
</html>

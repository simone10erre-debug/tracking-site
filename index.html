<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universal Shipping Tracking</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235d8574' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='0' y='0' width='24' height='24' fill='white'/><path d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/><path d='m3.3 7 8.7 5 8.7-5'/><path d='M12 22V12'/></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235d8574' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='0' y='0' width='24' height='24' fill='white'/><path d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/><path d='m3.3 7 8.7 5 8.7-5'/><path d='M12 22V12'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        :root { --brand-green: #5d8574; }
        
        * {
            /* Impedisce la selezione del testo su tutta l'app */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Permette la selezione solo negli input */
        input { -webkit-user-select: text; user-select: text; }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #ffffff; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            overflow-x: hidden;
        }

        .btn-green { background-color: var(--brand-green); color: white; }
        .page { display: none; min-height: 100vh; animation: fadeIn 0.2s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #tracking-iframe { 
            width: 100%; 
            height: 2500px; 
            border: none; 
            margin-top: -65px; 
        }

        #mobile-install-btn { display: none; }
        @media (max-width: 1024px) { #mobile-install-btn { display: block; } }

        #ios-popup { background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div id="mobile-install-btn" class="p-4 bg-white border-b border-gray-100 sticky top-0 z-[150]">
        <button onclick="handleInstall()" class="w-full py-3 btn-green rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] shadow-lg shadow-[#5d8574]/20">
            Scarica l'App Ufficiale
        </button>
    </div>

    <div id="home-page" class="page active max-w-2xl mx-auto px-6 py-8">
        <nav class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-white border-2 border-[#f0f0f0] rounded-2xl flex items-center justify-center shadow-sm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#5d8574" stroke-width="2" class="w-7 h-7">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                        <path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-extrabold tracking-tighter">Universal Tracking</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button class="w-11 h-11 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:text-[#5d8574] transition-all">
                    <i class="far fa-user-circle text-xl"></i>
                </button>
                <button onclick="toggleModal(true)" class="w-11 h-11 rounded-full bg-gray-50 flex items-center justify-center text-gray-400 hover:text-[#5d8574] transition-all">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </nav>

        <div class="flex gap-8 border-b border-gray-100 mb-8 text-xs font-bold uppercase tracking-widest">
            <button onclick="setTab('active')" id="tab-active" class="pb-4 border-b-2 border-[#5d8574] text-gray-900">In Corso</button>
            <button onclick="setTab('archived')" id="tab-archived" class="pb-4 text-gray-300">Archiviati</button>
        </div>

        <div id="shipment-list" class="space-y-4"></div>
    </div>

    <div id="detail-page" class="page max-w-2xl mx-auto py-8">
        <div class="px-6">
            <button onclick="goToHome()" class="mb-6 text-gray-300 text-[10px] font-bold uppercase flex items-center gap-2">
                <i class="fas fa-chevron-left"></i> Indietro
            </button>
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="det-title" class="text-2xl font-black tracking-tighter text-gray-900">---</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span id="det-code" class="text-xs font-mono font-bold text-[#5d8574]">---</span>
                        <button onclick="copyCode()" class="text-gray-300 ml-2 text-xs"><i class="far fa-copy"></i></button>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="archiveCurrent()" class="w-10 h-10 rounded-xl bg-gray-50 text-gray-400 flex items-center justify-center"><i class="fas fa-archive"></i></button>
                    <button onclick="deleteCurrent()" class="w-10 h-10 rounded-xl bg-red-50 text-red-300 flex items-center justify-center"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
        <div class="w-full overflow-hidden">
            <div id="loader" class="py-20 text-center"><i class="fas fa-circle-notch fa-spin text-[#5d8574] text-xl"></i></div>
            <iframe id="tracking-iframe" src=""></iframe>
        </div>
    </div>

    <div id="ios-popup" class="fixed inset-0 z-[200] hidden flex items-end justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-8 text-center shadow-2xl">
            <div class="w-16 h-16 mx-auto mb-4 bg-white border border-gray-100 rounded-2xl flex items-center justify-center shadow-sm">
                 <svg viewBox="0 0 24 24" fill="none" stroke="#5d8574" stroke-width="2" class="w-10 h-10"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
            </div>
            <h3 class="text-lg font-black mb-2">Installa App</h3>
            <p class="text-sm text-gray-500 mb-6">Tocca <i class="far fa-share-square"></i> in basso nel browser e seleziona <strong>"Aggiungi alla schermata Home"</strong>.</p>
            <button onclick="closeIosPopup()" class="w-full py-4 btn-green rounded-2xl font-bold uppercase text-xs tracking-widest">Ho Capito</button>
        </div>
    </div>

    <div id="modalAdd" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-white/90 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-10 shadow-2xl border border-gray-100">
            <h3 class="text-lg font-black mb-6 text-center uppercase tracking-tight">Nuova Spedizione</h3>
            <input type="text" id="in-desc" placeholder="Nome Spedizione" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-sm mb-4">
            <input type="text" id="in-code" placeholder="Codice Tracking" class="w-full p-4 bg-gray-50 rounded-2xl outline-none text-sm mb-6 font-mono uppercase">
            <button onclick="save()" class="w-full py-4 btn-green rounded-2xl font-bold uppercase text-xs tracking-widest">Salva</button>
            <button onclick="toggleModal(false)" class="w-full text-gray-300 text-[10px] font-bold uppercase mt-4 text-center">Annulla</button>
        </div>
    </div>

    <script>
        // Stessa logica JS dei messaggi precedenti, ma con DB aggiornato per sicurezza
        let db = JSON.parse(localStorage.getItem('ust_v9_final')) || [];
        let currentId = null;
        let activeTab = 'active';

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

        function handleInstall() {
            if (isIOS()) { document.getElementById('ios-popup').classList.remove('hidden'); }
            else if (deferredPrompt) { deferredPrompt.prompt(); }
        }

        function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }

        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('mobile-install-btn').style.display = 'none';
        }

        function closeIosPopup() { document.getElementById('ios-popup').classList.add('hidden'); }

        function setTab(tab) {
            activeTab = tab;
            document.getElementById('tab-active').className = tab === 'active' ? 'pb-4 border-b-2 border-[#5d8574] text-gray-900' : 'pb-4 text-gray-300';
            document.getElementById('tab-archived').className = tab === 'archived' ? 'pb-4 border-b-2 border-[#5d8574] text-gray-900' : 'pb-4 text-gray-300';
            render();
        }

        function toggleModal(show) { document.getElementById('modalAdd').classList.toggle('hidden', !show); }

        function save() {
            const desc = document.getElementById('in-desc').value;
            const code = document.getElementById('in-code').value.toUpperCase().trim();
            if(!desc || !code) return;
            db.unshift({ id: Date.now(), desc, code, archived: false });
            localStorage.setItem('ust_v9_final', JSON.stringify(db));
            toggleModal(false); render();
        }

        function render() {
            const list = document.getElementById('shipment-list');
            const filtered = db.filter(x => activeTab === 'active' ? !x.archived : x.archived);
            list.innerHTML = filtered.map(item => `
                <div class="bg-white p-6 border border-gray-100 rounded-3xl cursor-pointer flex justify-between items-center" onclick="showDetail(${item.id})">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center text-[#5d8574]"><i class="fas fa-box"></i></div>
                        <div>
                            <h4 class="font-bold text-sm text-gray-900">${item.desc}</h4>
                            <p class="text-[10px] font-mono text-gray-300 uppercase">${item.code}</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-200"></i>
                </div>
            `).join('') || '<p class="text-center py-20 text-gray-300 text-[10px] font-bold uppercase">Lista Vuota</p>';
        }

        function showDetail(id) {
            const item = db.find(x => x.id === id);
            currentId = id;
            document.getElementById('det-title').innerText = item.desc;
            document.getElementById('det-code').innerText = item.code;
            const iframe = document.getElementById('tracking-iframe');
            document.getElementById('loader').style.display = 'block';
            iframe.style.display = 'none';
            iframe.src = `https://m.17track.net/en/track#nums=${item.code}`;
            iframe.onload = () => { document.getElementById('loader').style.display = 'none'; iframe.style.display = 'block'; };
            document.getElementById('home-page').classList.remove('active');
            document.getElementById('detail-page').classList.add('active');
            window.scrollTo(0,0);
        }

        function copyCode() {
            const code = document.getElementById('det-code').innerText;
            navigator.clipboard.writeText(code);
            // Feedback leggero senza interrompere l'app
            const originalColor = document.getElementById('det-code').style.color;
            document.getElementById('det-code').innerText = "COPIATO!";
            setTimeout(() => { document.getElementById('det-code').innerText = code; }, 1000);
        }

        function goToHome() {
            document.getElementById('detail-page').classList.remove('active');
            document.getElementById('home-page').classList.add('active');
            render();
        }

        function deleteCurrent() {
            if(!confirm("Vuoi eliminare?")) return;
            db = db.filter(x => x.id !== currentId);
            localStorage.setItem('ust_v9_final', JSON.stringify(db));
            goToHome();
        }

        function archiveCurrent() {
            const i = db.findIndex(x => x.id === currentId);
            db[i].archived = !db[i].archived;
            localStorage.setItem('ust_v9_final', JSON.stringify(db));
            goToHome();
        }

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        render();
    </script>
</body>
</html>

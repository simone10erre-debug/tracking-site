<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Shipping Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .detail-view { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        .detail-view.active { transform: translateX(0); }
        .sponsor-column { min-width: 180px; }
        .nav-tab.active { border-bottom: 4px solid #5d8574; color: #5d8574; }
    </style>
</head>
<body>

    <div class="flex justify-center items-start gap-8 max-w-[1800px] mx-auto min-h-screen p-4 md:p-8">
        
        <div class="sponsor-column hidden xl:block"></div>

        <div class="w-full max-w-5xl bg-white rounded-[2.5rem] shadow-2xl border border-gray-100 flex flex-col overflow-hidden shadow-blue-900/5">
            
            <header class="p-8 md:p-12 bg-white border-b border-gray-50 flex flex-col md:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-5">
                    <div class="bg-[#5d8574] p-4 rounded-2xl text-white shadow-xl shadow-[#5d8574]/30">
                        <i class="fas fa-globe-americas text-3xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-black text-gray-800 tracking-tighter leading-none">UNIVERSAL</h1>
                        <p class="text-[#5d8574] font-bold tracking-[0.2em] text-xs mt-1">SHIPPING TRACKING</p>
                    </div>
                </div>
                <button onclick="openModal()" class="bg-gray-900 text-white px-10 py-5 rounded-2xl font-bold hover:bg-black transition-all active:scale-95 shadow-xl">
                    + NUOVA SPEDIZIONE
                </button>
            </header>

            <div class="flex px-12 border-b border-gray-50 bg-gray-50/50">
                <button onclick="switchTab('attivi')" id="tab-attivi" class="nav-tab active px-6 py-4 font-bold text-sm uppercase tracking-widest">Attivi</button>
                <button onclick="switchTab('archiviati')" id="tab-archiviati" class="nav-tab px-6 py-4 font-bold text-sm uppercase tracking-widest text-gray-400">Archiviati</button>
            </div>

            <div class="p-8 md:p-12">
                <div class="relative mb-10">
                    <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-gray-300"></i>
                    <input type="text" id="search-bar" onkeyup="renderList()" placeholder="Cerca codice o nome..." class="w-full pl-16 pr-6 py-5 bg-gray-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-[#5d8574]/20 font-medium">
                </div>

                <div id="shipment-list" class="space-y-4"></div>
            </div>
        </div>

        <div class="sponsor-column hidden xl:block"></div>
    </div>

    <div id="detail-pane" class="detail-view fixed top-0 right-0 h-full w-full md:w-[750px] bg-white flex flex-col shadow-2xl">
        <div class="p-6 border-b flex justify-between items-center">
            <button onclick="closeDetail()" class="font-bold text-gray-400 hover:text-black tracking-widest text-xs uppercase flex items-center gap-2">
                <i class="fas fa-times text-lg"></i> Chiudi Finestra
            </button>
            <div id="action-buttons" class="flex gap-2"></div>
        </div>
        <div id="YQContainer" class="flex-1 bg-white"></div>
    </div>

    <div id="modal" class="fixed inset-0 bg-gray-900/90 backdrop-blur-sm z-[2000] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-md p-10">
            <h3 id="modal-title" class="text-2xl font-black mb-6 uppercase italic">Aggiungi Tracking</h3>
            <input type="hidden" id="edit-id">
            <div class="space-y-4">
                <input type="text" id="input-title" placeholder="Nome (es. Amazon)" class="w-full p-5 bg-gray-100 rounded-2xl outline-none border-none focus:ring-2 focus:ring-[#5d8574]">
                <input type="text" id="input-code" placeholder="Codice Tracking" class="w-full p-5 bg-gray-100 rounded-2xl outline-none border-none focus:ring-2 focus:ring-[#5d8574] font-mono">
                <button onclick="saveShipment()" class="w-full bg-[#5d8574] text-white py-5 rounded-2xl font-bold uppercase tracking-widest shadow-lg">Salva</button>
                <button onclick="closeModal()" class="w-full text-gray-400 font-bold text-xs uppercase py-2">Annulla</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://www.17track.net/externalcall.js"></script>

    <script>
        let shipments = JSON.parse(localStorage.getItem('universal_shipping_db')) || [];
        let currentTab = 'attivi';

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-attivi').classList.toggle('active', tab === 'attivi');
            document.getElementById('tab-archiviati').classList.toggle('active', tab === 'archiviati');
            renderList();
        }

        function saveShipment() {
            const title = document.getElementById('input-title').value.trim();
            const code = document.getElementById('input-code').value.trim().toUpperCase();
            const editId = document.getElementById('edit-id').value;

            if (!title || !code) return alert("Inserisci dati validi!");

            if (editId) {
                const i = shipments.findIndex(s => s.id == editId);
                shipments[i] = { ...shipments[i], title, code };
            } else {
                shipments.unshift({ id: Date.now(), title, code, archived: false, lastStatus: 'In attesa di dati...' });
            }

            localStorage.setItem('universal_shipping_db', JSON.stringify(shipments));
            closeModal();
            renderList();
        }

        function renderList() {
            const container = document.getElementById('shipment-list');
            const search = document.getElementById('search-bar').value.toLowerCase();
            
            const filtered = shipments.filter(s => {
                const matchesSearch = s.title.toLowerCase().includes(search) || s.code.includes(search.toUpperCase());
                const matchesTab = currentTab === 'archiviati' ? s.archived : !s.archived;
                return matchesSearch && matchesTab;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="py-20 text-center text-gray-300 italic">Nessuna spedizione in questa sezione.</div>`;
                return;
            }

            container.innerHTML = filtered.map(s => `
                <div onclick="openTracking('${s.code}', '${s.title}', ${s.id})" class="bg-white p-6 rounded-[1.5rem] border border-gray-100 shadow-sm flex justify-between items-center hover:border-[#5d8574] transition-all cursor-pointer group">
                    <div class="flex items-center gap-5">
                        <div class="w-14 h-14 bg-gray-50 rounded-2xl flex items-center justify-center text-[#5d8574] group-hover:bg-[#5d8574] group-hover:text-white transition-all">
                            <i class="fas fa-box"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-gray-800 text-lg leading-tight">${s.title}</h3>
                            <p class="text-xs font-mono text-gray-400 uppercase tracking-widest">${s.code}</p>
                            <p class="text-[10px] font-bold text-[#5d8574] uppercase mt-1 italic"><i class="fas fa-sync-alt fa-spin mr-1"></i> ${s.lastStatus}</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-200 group-hover:text-[#5d8574]"></i>
                </div>
            `).join('');
        }

        function openTracking(code, title, id) {
            document.getElementById('detail-pane').classList.add('active');
            const s = shipments.find(x => x.id == id);
            
            document.getElementById('action-buttons').innerHTML = `
                <button onclick="toggleArchive(${id})" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-600 hover:text-white transition-all">
                    <i class="fas ${s.archived ? 'fa-box-open' : 'fa-archive'}"></i> ${s.archived ? 'Ripristina' : 'Archivia'}
                </button>
                <button onclick="editModal(${id})" class="bg-gray-100 text-gray-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">Modifica</button>
                <button onclick="deleteShipment(${id})" class="bg-red-50 text-red-500 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest">Elimina</button>
            `;

            const container = document.getElementById('YQContainer');
            container.innerHTML = '<div class="p-20 text-center text-gray-300 font-bold animate-pulse uppercase text-xs tracking-widest">Richiesta dati ai server...</div>';

            setTimeout(() => {
                if (window.YQT_DoTrack) {
                    YQT_DoTrack({ YQ_ElementId: "YQContainer", YQ_Width: "100%", YQ_Height: "100%", YQ_Fc: "0", YQ_Lang: "it", YQ_Num: code });
                }
            }, 500);
        }

        function toggleArchive(id) {
            const i = shipments.findIndex(s => s.id == id);
            shipments[i].archived = !shipments[i].archived;
            localStorage.setItem('universal_shipping_db', JSON.stringify(shipments));
            closeDetail();
            renderList();
        }

        function deleteShipment(id) {
            if(!confirm("Eliminare definitivamente?")) return;
            shipments = shipments.filter(s => s.id !== id);
            localStorage.setItem('universal_shipping_db', JSON.stringify(shipments));
            closeDetail();
            renderList();
        }

        function editModal(id) {
            const s = shipments.find(x => x.id == id);
            document.getElementById('edit-id').value = s.id;
            document.getElementById('input-title').value = s.title;
            document.getElementById('input-code').value = s.code;
            document.getElementById('modal-title').innerText = "Modifica Tracking";
            closeDetail();
            openModal();
        }

        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { 
            document.getElementById('modal').classList.add('hidden'); 
            document.getElementById('edit-id').value = "";
            document.getElementById('input-title').value = "";
            document.getElementById('input-code').value = "";
        }
        function closeDetail() { document.getElementById('detail-pane').classList.remove('active'); }

        renderList();
    </script>
</body>
</html>

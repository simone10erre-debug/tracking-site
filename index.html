<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Shipping Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1f2937; overflow-x: hidden; }
        .btn-primary { background-color: #5d8574; }
        
        /* Pannello laterale che scorre */
        #trackingPanel {
            position: fixed; top: 0; right: 0; height: 100%; width: 100%;
            background: white; z-index: 100; transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }
        @media (min-width: 768px) { #trackingPanel { width: 500px; } }
        #trackingPanel.open { transform: translateX(0); }

        /* Mascheramento: nascondiamo l'header di 17track spostando l'iframe in alto */
        .iframe-wrapper {
            width: 100%; height: 100%; overflow: hidden; position: relative;
        }
        #trackIframe {
            width: 100%; height: calc(100% + 150px);
            border: none; position: absolute; top: -70px; /* Nasconde l'header originale */
        }

        .tab-active { color: #5d8574; border-bottom: 2px solid #5d8574; font-weight: 700; }
        .badge-count { background: #f1f3f5; color: #868e96; border-radius: 20px; padding: 2px 8px; font-size: 11px; margin-left: 6px; }
        .active .badge-count { background: #e6f0eb; color: #5d8574; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-3xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 btn-primary rounded-xl flex items-center justify-center shadow-md">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" class="w-7 h-7">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                        <path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">Universal Shipping Tracking</h1>
                    <p class="text-gray-400 text-[11px] font-bold uppercase tracking-widest">Global Logistics System</p>
                </div>
            </div>
            <button onclick="toggleModal(true)" class="w-12 h-12 btn-primary text-white rounded-full flex items-center justify-center shadow-lg active:scale-90 transition-all">
                <i class="fas fa-plus text-xl"></i>
            </button>
        </header>

        <div class="flex gap-8 border-b border-gray-100 mb-8">
            <div onclick="switchTab('active')" id="tabActive" class="tab-active pb-4 cursor-pointer text-sm uppercase">In progress <span id="countActive" class="badge-count">0</span></div>
            <div onclick="switchTab('archive')" id="tabArchive" class="pb-4 cursor-pointer text-gray-400 text-sm uppercase">Archive <span id="countArchive" class="badge-count">0</span></div>
        </div>

        <div id="listContainer"></div>
    </div>

    <div id="trackingPanel" class="flex flex-col">
        <div class="p-6 border-b flex items-center justify-between bg-white z-10">
            <button onclick="closePanel()" class="text-gray-400 font-bold text-xs uppercase flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Close
            </button>
            <div class="text-center">
                <p id="panelDesc" class="font-bold text-sm">---</p>
                <p id="panelCode" class="text-[10px] text-gray-400 font-mono uppercase">---</p>
            </div>
            <div class="w-10"></div> </div>
        <div class="flex-1 iframe-wrapper">
            <div id="loading" class="absolute inset-0 flex items-center justify-center bg-white z-10">
                <i class="fas fa-circle-notch fa-spin text-[#5d8574] text-2xl"></i>
            </div>
            <iframe id="trackIframe" src="" onload="document.getElementById('loading').style.display='none'"></iframe>
        </div>
    </div>

    <div id="modalAdd" class="fixed inset-0 z-[200] hidden flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-10 shadow-2xl">
            <h2 class="text-2xl font-extrabold mb-8 text-center uppercase">New Shipment</h2>
            <div class="space-y-4">
                <input type="text" id="inputDesc" placeholder="Description" class="w-full p-4 bg-gray-50 rounded-xl outline-none text-sm">
                <input type="text" id="inputCode" placeholder="Tracking Number" class="w-full p-4 bg-gray-50 rounded-xl outline-none font-mono uppercase text-sm">
                <button onclick="addShipment()" class="w-full py-4 btn-primary text-white rounded-xl font-extrabold text-sm uppercase tracking-widest mt-6">Add shipment</button>
                <button onclick="toggleModal(false)" class="w-full py-2 text-gray-400 font-bold text-[10px] uppercase mt-2">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        let shipments = JSON.parse(localStorage.getItem('ust_v3_db')) || [];
        let currentTab = 'active';

        function toggleModal(s) { document.getElementById('modalAdd').classList.toggle('hidden', !s); }

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tabActive').className = t === 'active' ? 'tab-active pb-4 cursor-pointer text-sm uppercase' : 'pb-4 cursor-pointer text-gray-400 text-sm uppercase';
            document.getElementById('tabArchive').className = t === 'archive' ? 'tab-active pb-4 cursor-pointer text-sm uppercase' : 'pb-4 cursor-pointer text-gray-400 text-sm uppercase';
            renderList();
        }

        function addShipment() {
            const desc = document.getElementById('inputDesc').value;
            const code = document.getElementById('inputCode').value.toUpperCase();
            if(!desc || !code) return;
            shipments.unshift({ id: Date.now(), desc, code, archived: false });
            localStorage.setItem('ust_v3_db', JSON.stringify(shipments));
            toggleModal(false); renderList();
        }

        function renderList() {
            const container = document.getElementById('listContainer');
            document.getElementById('countActive').innerText = shipments.filter(s => !s.archived).length;
            document.getElementById('countArchive').innerText = shipments.filter(s => s.archived).length;
            const filtered = shipments.filter(s => (currentTab === 'active' ? !s.archived : s.archived));

            container.innerHTML = filtered.length ? filtered.map(s => `
                <div class="bg-white border border-gray-100 p-6 rounded-[1.5rem] flex justify-between items-center mb-4 hover:border-[#5d8574] cursor-pointer shadow-sm group" onclick="openPanel('${s.code}', '${s.desc}')">
                    <div class="flex items-center gap-5">
                        <div class="w-12 h-12 bg-gray-50 rounded-xl flex items-center justify-center text-[#5d8574] group-hover:bg-[#5d8574] group-hover:text-white transition-all"><i class="fas fa-truck-fast"></i></div>
                        <div><h4 class="font-bold text-sm">${s.desc}</h4><p class="text-[10px] font-mono text-gray-400 font-bold uppercase">${s.code}</p></div>
                    </div>
                    <div class="flex gap-4" onclick="event.stopPropagation()">
                        <button onclick="toggleArchive(${s.id})" class="text-gray-300 hover:text-[#5d8574]"><i class="fas fa-archive"></i></button>
                        <button onclick="deleteShipment(${s.id})" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `).join('') : '<div class="text-center py-20 text-gray-300 uppercase text-[10px] font-bold tracking-widest">No shipments found</div>';
        }

        function openPanel(code, desc) {
            document.getElementById('panelDesc').innerText = desc;
            document.getElementById('panelCode').innerText = code;
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('trackIframe').src = `https://t.17track.net/en#nums=${code}`;
            document.getElementById('trackingPanel').classList.add('open');
        }

        function closePanel() {
            document.getElementById('trackingPanel').classList.remove('open');
            setTimeout(() => { document.getElementById('trackIframe').src = ''; }, 400);
        }

        function toggleArchive(id) {
            const i = shipments.findIndex(s => s.id === id);
            shipments[i].archived = !shipments[i].archived;
            localStorage.setItem('ust_v3_db', JSON.stringify(shipments));
            renderList();
        }

        function deleteShipment(id) {
            if(!confirm("Delete?")) return;
            shipments = shipments.filter(s => s.id !== id);
            localStorage.setItem('ust_v3_db', JSON.stringify(shipments));
            renderList();
        }

        renderList();
    </script>
</body>
</html>

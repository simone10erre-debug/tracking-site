<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Shipping Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #ffffff; }
        .btn-green { background-color: #5d8574; }
        
        /* PANNELLO LATERALE */
        #trackingPanel {
            position: fixed; top: 0; right: 0; height: 100%; width: 100%;
            background: white; z-index: 1000; transform: translateX(100%);
            transition: transform 0.4s ease; display: flex; flex-direction: column;
        }
        @media (min-width: 768px) { #trackingPanel { width: 450px; border-left: 1px solid #eee; } }
        #trackingPanel.open { transform: translateX(0); }

        /* IL TRUCCO DEL RITAGLIO FISSO */
        .viewport-container {
            flex-grow: 1; 
            position: relative; 
            overflow: hidden; /* Taglia tutto ciò che esce */
            background: #fff;
        }

        #trackIframe {
            position: absolute;
            width: 100%;
            height: 1000px; /* Altezza grande per caricare tutto */
            top: -130px;    /* SPOSTA IN ALTO per centrare il riquadro rosso */
            left: 0;
            border: none;
        }

        /* IL "VETRO" INVISIBILE - Questo blocca lo scroll nell'iframe */
        .glass-cover {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20; /* Sta sopra l'iframe */
            background: transparent;
            cursor: default;
        }

        .tab-active { color: #5d8574; border-bottom: 2px solid #5d8574; font-weight: 700; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-3xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 btn-green rounded-xl flex items-center justify-center shadow-md">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" class="w-7 h-7">
                        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path>
                        <path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight">Universal Shipping Tracking</h1>
                    <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest">Global Logistics System</p>
                </div>
            </div>
            <button onclick="openModal()" class="w-11 h-11 btn-green text-white rounded-full flex items-center justify-center shadow-lg"><i class="fas fa-plus"></i></button>
        </header>

        <div class="flex gap-8 border-b border-gray-100 mb-8 text-sm font-bold uppercase tracking-tighter">
            <div onclick="setTab('active')" id="tab-active" class="tab-active pb-4 cursor-pointer">In Progress</div>
            <div onclick="setTab('archived')" id="tab-archived" class="pb-4 cursor-pointer text-gray-300">Archive</div>
        </div>

        <div id="shipment-list" class="space-y-4"></div>
    </div>

    <div id="trackingPanel">
        <div class="p-6 border-b flex justify-between items-center">
            <button onclick="closePanel()" class="text-gray-400 text-[10px] font-black uppercase tracking-widest flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Back to List
            </button>
        </div>
        
        <div class="viewport-container">
            <div class="glass-cover"></div>
            
            <div id="loader" class="absolute inset-0 flex items-center justify-center bg-white z-30">
                <i class="fas fa-circle-notch fa-spin text-green-700 text-2xl"></i>
            </div>
            
            <iframe id="trackIframe" src="" scrolling="no"></iframe>
        </div>
    </div>

    <div id="modalAdd" class="fixed inset-0 z-[2000] hidden flex items-center justify-center p-6 bg-black/40">
        <div class="bg-white rounded-[2rem] w-full max-w-sm p-8">
            <input type="text" id="in-desc" placeholder="Product" class="w-full p-4 bg-gray-100 rounded-xl mb-4 outline-none">
            <input type="text" id="in-code" placeholder="Tracking Number" class="w-full p-4 bg-gray-100 rounded-xl mb-4 outline-none uppercase">
            <button onclick="save()" class="w-full py-4 btn-green text-white rounded-xl font-bold uppercase">Save</button>
            <button onclick="closeModal()" class="w-full text-gray-400 text-xs mt-4">Cancel</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('ust_final_v5')) || [];

        function save() {
            const desc = document.getElementById('in-desc').value;
            const code = document.getElementById('in-code').value.toUpperCase();
            if(!desc || !code) return;
            db.unshift({ id: Date.now(), desc, code, arch: false });
            localStorage.setItem('ust_final_v5', JSON.stringify(db));
            closeModal(); render();
        }

        function render() {
            const list = document.getElementById('shipment-list');
            const items = db.filter(x => x.arch === (document.getElementById('tab-archived').className.includes('active')));
            list.innerHTML = items.map(x => `
                <div class="bg-white border border-gray-100 p-6 rounded-2xl flex justify-between items-center cursor-pointer hover:border-green-700" onclick="openPanel('${x.code}')">
                    <div>
                        <h4 class="font-bold text-sm">${x.desc}</h4>
                        <p class="text-[10px] text-gray-400 font-mono">${x.code}</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-200"></i>
                </div>
            `).join('');
        }

        function openPanel(code) {
            document.getElementById('loader').style.display = 'flex';
            // Carichiamo la versione mobile che è più pulita e facile da "centrare"
            document.getElementById('trackIframe').src = `https://m.17track.net/en/track#nums=${code}`;
            document.getElementById('trackingPanel').classList.add('open');
        }

        function closePanel() {
            document.getElementById('trackingPanel').classList.remove('open');
            setTimeout(() => { document.getElementById('trackIframe').src = ''; }, 400);
        }

        function openModal() { document.getElementById('modalAdd').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modalAdd').classList.add('hidden'); }
        
        render();
    </script>
</body>
</html>

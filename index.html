<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Shipping Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; color: #1a1a1a; margin: 0; padding: 0; }
        .btn-green { background-color: #5d8574; }
        .text-green { color: #5d8574; }
        .tab-active { border-bottom: 2px solid #5d8574; color: #5d8574; font-weight: 700; }
        .counter { background-color: #f1f3f5; color: #868e96; border-radius: 99px; padding: 2px 8px; font-size: 11px; margin-left: 6px; }
        
        /* Card style per somigliare all'immagine */
        .shipment-card {
            border: 1px solid #f0f0f0;
            border-radius: 1.5rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .shipment-card:hover {
            border-color: #5d8574;
            background-color: #fafafa;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-3xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="w-12 h-12 object-contain" onerror="this.outerHTML='<div class=\"w-12 h-12 btn-green rounded-xl flex items-center justify-center text-white text-2xl shadow-lg\"><i class=\"fas fa-box\"></i></div>'">
                <div>
                    <h1 class="text-xl font-black uppercase tracking-tight">Universal Shipping Tracking</h1>
                    <p class="text-gray-400 text-[10px] font-bold tracking-[0.2em] uppercase">Global Logistics System</p>
                </div>
            </div>
            <button onclick="openModal()" class="w-12 h-12 btn-green text-white rounded-full flex items-center justify-center shadow-lg hover:scale-105 active:scale-90 transition-all">
                <i class="fas fa-plus"></i>
            </button>
        </header>

        <div class="flex gap-8 border-b border-gray-100 mb-8">
            <button onclick="switchTab('active')" id="tab-active" class="tab-active pb-4 flex items-center text-sm">In progress <span id="count-active" class="counter">0</span></button>
            <button onclick="switchTab('archived')" id="tab-archived" class="pb-4 text-gray-400 flex items-center text-sm">Archive <span id="count-archived" class="counter">0</span></button>
        </div>

        <div class="relative mb-8">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
            <input type="text" id="search" onkeyup="renderList()" placeholder="Search shipments..." class="w-full bg-gray-50 border-none py-4 pl-14 pr-6 rounded-2xl outline-none text-sm">
        </div>

        <div id="list" class="space-y-4"></div>
    </div>

    <div id="add-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[50] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[2.5rem] w-full max-w-sm p-10 shadow-2xl">
            <h3 class="font-black text-xl mb-8 text-center uppercase tracking-tight">New Shipment</h3>
            <div class="space-y-4">
                <input type="text" id="desc" placeholder="What's inside? (e.g. iPhone)" class="w-full p-4 bg-gray-50 rounded-xl border-none outline-none">
                <input type="text" id="code" placeholder="Tracking Number" class="w-full p-4 bg-gray-50 rounded-xl border-none outline-none font-mono uppercase">
                <button onclick="save()" class="w-full py-4 btn-green text-white rounded-xl font-black uppercase tracking-widest shadow-lg mt-4">Add Shipment</button>
                <button onclick="closeModal()" class="w-full text-gray-400 font-bold text-[10px] uppercase py-2">Close</button>
            </div>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('ship_db_vfinal')) || [];
        let currentTab = 'active';

        function switchTab(t) {
            currentTab = t;
            document.getElementById('tab-active').className = t === 'active' ? 'tab-active pb-4 flex items-center text-sm' : 'pb-4 text-gray-400 flex items-center text-sm';
            document.getElementById('tab-archived').className = t === 'archived' ? 'tab-active pb-4 flex items-center text-sm' : 'pb-4 text-gray-400 flex items-center text-sm';
            renderList();
        }

        function save() {
            const d = document.getElementById('desc').value;
            const c = document.getElementById('code').value.toUpperCase();
            if(!d || !c) return;
            db.unshift({ id: Date.now(), desc: d, code: c, archived: false });
            localStorage.setItem('ship_db_vfinal', JSON.stringify(db));
            closeModal();
            renderList();
        }

        function renderList() {
            const container = document.getElementById('list');
            const search = document.getElementById('search').value.toLowerCase();
            
            document.getElementById('count-active').innerText = db.filter(x => !x.archived).length;
            document.getElementById('count-archived').innerText = db.filter(x => x.archived).length;

            const filtered = db.filter(x => 
                (x.desc.toLowerCase().includes(search) || x.code.toLowerCase().includes(search)) &&
                (currentTab === 'archived' ? x.archived : !x.archived)
            );

            container.innerHTML = filtered.length ? filtered.map(x => `
                <div class="shipment-card bg-white p-6 flex justify-between items-center" onclick="track('${x.code}')">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-gray-50 rounded-2xl flex items-center justify-center text-green shadow-sm">
                            <i class="fas fa-truck-fast"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm text-gray-800">${x.desc}</h3>
                            <p class="text-[10px] font-mono text-gray-400 font-bold uppercase tracking-widest mt-1">${x.code}</p>
                        </div>
                    </div>
                    <div class="flex gap-4" onclick="event.stopPropagation()">
                        <button onclick="toggleArc(${x.id})" class="text-gray-300 hover:text-blue-500"><i class="fas fa-archive text-xs"></i></button>
                        <button onclick="del(${x.id})" class="text-gray-300 hover:text-red-500"><i class="fas fa-trash-alt text-xs"></i></button>
                    </div>
                </div>
            `).join('') : '<div class="text-center py-20 text-gray-300 uppercase text-[10px] font-bold tracking-widest">No shipments here</div>';
        }

        function track(code) {
            // Popup centrale che non viene bloccato e non dà "connessione negata"
            const w = 500; const h = 750;
            const left = (screen.width/2)-(w/2); const top = (screen.height/2)-(h/2);
            window.open(`https://t.17track.net/en#nums=${code}`, 'Tracking', `width=${w},height=${h},top=${top},left=${left},scrollbars=yes`);
        }

        function toggleArc(id) {
            const i = db.findIndex(x => x.id === id);
            db[i].archived = !db[i].archived;
            localStorage.setItem('ship_db_vfinal', JSON.stringify(db));
            renderList();
        }

        function del(id) {
            if(!confirm("Delete?")) return;
            db = db.filter(x => x.id !== id);
            localStorage.setItem('ship_db_vfinal', JSON.stringify(db));
            renderList();
        }

        function openModal() { document.getElementById('add-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('add-modal').classList.add('hidden'); }
        
        renderList();
    </script>
</body>
</html>
